services:
  mongo:
    image: mongo:7.0

  mongo-init:
    image: mongo:7.0

  backend:
    image: profilepilot-backend:dev
    build:
      context: ./backend

  frontend:
    image: profilepilot-frontend:dev
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: /backend
        INTERNAL_API_URL: http://backend:5000
